<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" font-family="Segoe UI, Arial, sans-serif">
  <rect width="600" height="300" fill="#ffffff"/>
  <text x="300" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1d23">RAID Layouts X, Y, Z</text>

  <!-- X: RAID 0 striping -->
  <text x="105" y="55" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1d23">X</text>
  <g font-size="11" fill="#ffffff">
    <rect x="55" y="65" width="100" height="34" fill="#2f6fed"/>
    <text x="105" y="87" text-anchor="middle">A1</text>
    <rect x="55" y="103" width="100" height="34" fill="#a9c6f9"/>
    <text x="105" y="125" text-anchor="middle" fill="#1a3a6b">A2</text>
  </g>
  <text x="105" y="155" text-anchor="middle" font-size="11" fill="#666">Disk 1</text>
  <g font-size="11" fill="#ffffff">
    <rect x="165" y="65" width="100" height="34" fill="#2f6fed"/>
    <text x="215" y="87" text-anchor="middle">A3</text>
    <rect x="165" y="103" width="100" height="34" fill="#a9c6f9"/>
    <text x="215" y="125" text-anchor="middle" fill="#1a3a6b">A4</text>
  </g>
  <text x="215" y="155" text-anchor="middle" font-size="11" fill="#666">Disk 2</text>

  <!-- Y: RAID 1 mirroring -->
  <text x="335" y="55" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1d23">Y</text>
  <rect x="300" y="65" width="80" height="72" fill="#2f6fed"/>
  <text x="340" y="105" text-anchor="middle" font-size="12" fill="#ffffff">A (copy)</text>
  <text x="340" y="155" text-anchor="middle" font-size="11" fill="#666">Disk 1</text>
  <rect x="390" y="65" width="80" height="72" fill="#2f6fed"/>
  <text x="430" y="105" text-anchor="middle" font-size="12" fill="#ffffff">A (copy)</text>
  <text x="430" y="155" text-anchor="middle" font-size="11" fill="#666">Disk 2</text>

  <!-- Z: RAID 5 striping + parity -->
  <text x="530" y="55" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1d23">Z</text>
  <g font-size="10.5">
    <rect x="500" y="65" width="55" height="34" fill="#2f6fed"/>
    <text x="527" y="87" text-anchor="middle" fill="#ffffff">A1</text>
    <rect x="500" y="103" width="55" height="34" fill="#a9c6f9"/>
    <text x="527" y="125" text-anchor="middle" fill="#1a3a6b">A2</text>
  </g>
  <text x="527" y="153" text-anchor="middle" font-size="10" fill="#666">Disk 1</text>

  <text x="300" y="230" text-anchor="middle" font-size="13" fill="#666">X = striping only, Y = mirroring, Z = striping with parity</text>
  <text x="300" y="255" text-anchor="middle" font-size="13" fill="#666">Which layout is RAID 1?</text>
</svg>
