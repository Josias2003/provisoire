<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" font-family="Segoe UI, Arial, sans-serif">
  <rect width="600" height="200" fill="#ffffff"/>
  <text x="300" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1d23">Computer Startup Sequence</text>

  <g font-size="13">
    <rect x="15"  y="70" width="120" height="55" rx="8" fill="#eef0f3" stroke="#d5d8de"/>
    <text x="75" y="102" text-anchor="middle" fill="#1a1d23">Step 1</text>

    <rect x="165" y="70" width="120" height="55" rx="8" fill="#2f6fed" stroke="#255bc4"/>
    <text x="225" y="102" text-anchor="middle" fill="#ffffff">Step 2</text>

    <rect x="315" y="70" width="120" height="55" rx="8" fill="#eef0f3" stroke="#d5d8de"/>
    <text x="375" y="102" text-anchor="middle" fill="#1a1d23">Step 3</text>

    <rect x="465" y="70" width="120" height="55" rx="8" fill="#eef0f3" stroke="#d5d8de"/>
    <text x="525" y="102" text-anchor="middle" fill="#1a1d23">Step 4</text>
  </g>

  <g stroke="#9aa3b2" stroke-width="2.5" marker-end="url(#a4)">
    <line x1="135" y1="97" x2="160" y2="97"/>
    <line x1="285" y1="97" x2="310" y2="97"/>
    <line x1="435" y1="97" x2="460" y2="97"/>
  </g>
  <defs>
    <marker id="a4" markerWidth="10" markerHeight="10" refX="4" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 z" fill="#9aa3b2"/>
    </marker>
  </defs>

  <text x="75"  y="145" text-anchor="middle" font-size="12" fill="#666">Power applied,</text>
  <text x="75"  y="160" text-anchor="middle" font-size="12" fill="#666">hardware checked</text>
  <text x="225" y="145" text-anchor="middle" font-size="12" fill="#1a3a6b" font-weight="600">(highlighted step)</text>
  <text x="375" y="145" text-anchor="middle" font-size="12" fill="#666">Kernel loads,</text>
  <text x="375" y="160" text-anchor="middle" font-size="12" fill="#666">drivers initialize</text>
  <text x="525" y="145" text-anchor="middle" font-size="12" fill="#666">User logs in,</text>
  <text x="525" y="160" text-anchor="middle" font-size="12" fill="#666">desktop loads</text>
</svg>
