<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="Segoe UI, Arial, sans-serif">
  <rect width="600" height="420" fill="#ffffff"/>
  <text x="300" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1d23">Printer Won't Print - Troubleshooting Flow</text>

  <rect x="200" y="45" width="200" height="45" rx="8" fill="#eef0f3" stroke="#d5d8de"/>
  <text x="300" y="72" text-anchor="middle" font-size="13" fill="#1a1d23">Print job stuck / nothing prints</text>

  <line x1="300" y1="90" x2="300" y2="120" stroke="#9aa3b2" stroke-width="2.5" marker-end="url(#a5)"/>

  <polygon points="300,120 400,160 300,200 200,160" fill="#a9c6f9" stroke="#2f6fed" stroke-width="2"/>
  <text x="300" y="164" text-anchor="middle" font-size="12.5" fill="#1a3a6b">Printer powered on?</text>

  <line x1="200" y1="160" x2="90" y2="160" stroke="#9aa3b2" stroke-width="2.5" marker-end="url(#a5)"/>
  <text x="145" y="150" text-anchor="middle" font-size="11" fill="#666">No</text>
  <rect x="10" y="140" width="140" height="40" rx="6" fill="#eef0f3" stroke="#d5d8de"/>
  <text x="80" y="165" text-anchor="middle" font-size="11.5" fill="#1a1d23">Power it on, retry</text>

  <line x1="300" y1="200" x2="300" y2="230" stroke="#9aa3b2" stroke-width="2.5" marker-end="url(#a5)"/>
  <text x="315" y="220" font-size="11" fill="#666">Yes</text>

  <polygon points="300,230 400,270 300,310 200,270" fill="#a9c6f9" stroke="#2f6fed" stroke-width="2"/>
  <text x="300" y="266" text-anchor="middle" font-size="12" fill="#1a3a6b">Connection (USB/</text>
  <text x="300" y="280" text-anchor="middle" font-size="12" fill="#1a3a6b">network) OK?</text>

  <line x1="200" y1="270" x2="90" y2="270" stroke="#9aa3b2" stroke-width="2.5" marker-end="url(#a5)"/>
  <text x="145" y="260" text-anchor="middle" font-size="11" fill="#666">No</text>
  <rect x="10" y="250" width="140" height="40" rx="6" fill="#eef0f3" stroke="#d5d8de"/>
  <text x="80" y="275" text-anchor="middle" font-size="11.5" fill="#1a1d23">Fix cable/network</text>

  <line x1="300" y1="310" x2="300" y2="340" stroke="#9aa3b2" stroke-width="2.5" marker-end="url(#a5)"/>
  <text x="315" y="330" font-size="11" fill="#666">Yes</text>

  <rect x="200" y="340" width="200" height="50" rx="8" fill="#2f6fed" stroke="#255bc4"/>
  <text x="300" y="362" text-anchor="middle" font-size="12.5" fill="#ffffff">Check the print spooler</text>
  <text x="300" y="378" text-anchor="middle" font-size="12.5" fill="#ffffff">service, then retry</text>

  <defs>
    <marker id="a5" markerWidth="10" markerHeight="10" refX="4" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 z" fill="#9aa3b2"/>
    </marker>
  </defs>
</svg>
