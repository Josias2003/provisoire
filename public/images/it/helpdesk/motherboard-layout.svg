<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="Segoe UI, Arial, sans-serif">
  <rect width="600" height="420" fill="#ffffff"/>
  <text x="300" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1d23">Motherboard Layout (simplified)</text>

  <rect x="60" y="50" width="480" height="330" rx="10" fill="#f7f8fa" stroke="#d5d8de" stroke-width="2"/>

  <!-- 1: CPU socket -->
  <rect x="90" y="80" width="110" height="110" rx="6" fill="#a9c6f9" stroke="#2f6fed" stroke-width="2"/>
  <text x="145" y="140" text-anchor="middle" font-size="20" font-weight="700" fill="#1a3a6b">1</text>

  <!-- 2: RAM slots -->
  <g fill="#eef0f3" stroke="#d5d8de" stroke-width="2">
    <rect x="230" y="80" width="18" height="110"/>
    <rect x="255" y="80" width="18" height="110"/>
    <rect x="280" y="80" width="18" height="110"/>
    <rect x="305" y="80" width="18" height="110"/>
  </g>
  <text x="270" y="205" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1d23">2</text>

  <!-- 3: PCIe slot -->
  <rect x="90" y="230" width="260" height="24" rx="4" fill="#eef0f3" stroke="#d5d8de" stroke-width="2"/>
  <text x="365" y="248" font-size="20" font-weight="700" fill="#1a1d23">3</text>

  <!-- 4: SATA ports -->
  <g fill="#eef0f3" stroke="#d5d8de" stroke-width="2">
    <rect x="400" y="90" width="30" height="16"/>
    <rect x="400" y="112" width="30" height="16"/>
    <rect x="400" y="134" width="30" height="16"/>
    <rect x="400" y="156" width="30" height="16"/>
  </g>
  <text x="450" y="130" font-size="20" font-weight="700" fill="#1a1d23">4</text>

  <text x="300" y="400" text-anchor="middle" font-size="13" fill="#666">Which numbered component holds the system's RAM modules?</text>
</svg>
