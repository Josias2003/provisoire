<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" font-family="Segoe UI, Arial, sans-serif">
  <rect width="600" height="340" fill="#ffffff"/>
  <text x="300" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1d23">ESD Safety Setup</text>

  <!-- person -->
  <circle cx="150" cy="110" r="26" fill="#eef0f3" stroke="#d5d8de" stroke-width="2"/>
  <rect x="122" y="136" width="56" height="80" rx="14" fill="#eef0f3" stroke="#d5d8de" stroke-width="2"/>
  <text x="150" y="245" text-anchor="middle" font-size="13" fill="#1a1d23">Technician</text>

  <!-- wrist strap band -->
  <rect x="168" y="180" width="18" height="10" rx="4" fill="#2f6fed"/>

  <!-- coiled wire to ground point -->
  <path d="M186,185 C 230,150 260,220 300,190 S 360,150 400,190" fill="none" stroke="#2f6fed" stroke-width="3"/>

  <!-- computer case (grounded point) -->
  <rect x="400" y="150" width="140" height="100" rx="8" fill="#eef0f3" stroke="#d5d8de" stroke-width="2"/>
  <text x="470" y="205" text-anchor="middle" font-size="13" fill="#1a1d23">Computer</text>
  <text x="470" y="222" text-anchor="middle" font-size="13" fill="#1a1d23">case (grounded)</text>

  <text x="300" y="300" text-anchor="middle" font-size="13" fill="#666">An anti-static wrist strap connects the technician to a grounded surface</text>
</svg>
