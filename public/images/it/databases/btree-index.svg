<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" font-family="Segoe UI, Arial, sans-serif">
  <rect width="600" height="300" fill="#ffffff"/>
  <text x="300" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1d23">Table Index Structure</text>

  <g stroke="#9aa3b2" stroke-width="2.5">
    <line x1="300" y1="70" x2="180" y2="140"/>
    <line x1="300" y1="70" x2="420" y2="140"/>
    <line x1="180" y1="140" x2="120" y2="210"/>
    <line x1="180" y1="140" x2="240" y2="210"/>
    <line x1="420" y1="140" x2="360" y2="210"/>
    <line x1="420" y1="140" x2="480" y2="210"/>
  </g>

  <rect x="260" y="45" width="80" height="42" rx="6" fill="#2f6fed" stroke="#255bc4" stroke-width="2"/>
  <text x="300" y="71" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">root</text>

  <g fill="#eef0f3" stroke="#d5d8de" stroke-width="2">
