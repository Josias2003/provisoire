    <rect x="380" y="120" width="80" height="42" rx="6"/>
    <rect x="80" y="190" width="80" height="42" rx="6"/>
    <rect x="200" y="190" width="80" height="42" rx="6"/>
    <rect x="320" y="190" width="80" height="42" rx="6"/>
    <rect x="440" y="190" width="80" height="42" rx="6"/>
  </g>
  <g font-size="12.5" fill="#1a1d23">
    <text x="180" y="146" text-anchor="middle">branch</text>
    <text x="420" y="146" text-anchor="middle">branch</text>
    <text x="120" y="216" text-anchor="middle">leaf</text>
    <text x="240" y="216" text-anchor="middle">leaf</text>
    <text x="360" y="216" text-anchor="middle">leaf</text>
    <text x="480" y="216" text-anchor="middle">leaf</text>
  </g>

  <text x="300" y="270" text-anchor="middle" font-size="13" fill="#666">This tree structure is built by the database on a column</text>
