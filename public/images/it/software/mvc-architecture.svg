<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" font-family="Segoe UI, Arial, sans-serif">
  <rect width="600" height="360" fill="#ffffff"/>
  <text x="300" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1d23">MVC Architecture</text>

  <rect x="255" y="45" width="90" height="55" rx="8" fill="#eef0f3" stroke="#d5d8de" stroke-width="2"/>
  <text x="300" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1d23">User</text>

  <rect x="255" y="290" width="90" height="55" rx="8" fill="#2f6fed" stroke="#255bc4" stroke-width="2"/>
  <text x="300" y="323" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Controller</text>

  <rect x="60" y="165" width="120" height="55" rx="8" fill="#eef0f3" stroke="#d5d8de" stroke-width="2"/>
  <text x="120" y="198" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1d23">Model</text>

  <rect x="420" y="165" width="120" height="55" rx="8" fill="#eef0f3" stroke="#d5d8de" stroke-width="2"/>
  <text x="480" y="198" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1d23">View</text>

  <g stroke="#9aa3b2" stroke-width="2.5" fill="none" marker-end="url(#a6)">
    <path d="M300,100 300,285"/>
    <path d="M255,300 180,220"/>
    <path d="M420,220 345,300"/>
    <path d="M480,165 300,100"/>
  </g>
  <defs>
    <marker id="a6" markerWidth="10" markerHeight="10" refX="4" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 z" fill="#9aa3b2"/>
    </marker>
  </defs>

  <text x="300" y="255" text-anchor="middle" font-size="12" fill="#666">user input</text>
  <text x="150" y="255" text-anchor="middle" font-size="12" fill="#666">updates data</text>
  <text x="440" y="255" text-anchor="middle" font-size="12" fill="#666">selects display</text>
  <text x="420" y="90" text-anchor="middle" font-size="12" fill="#666">renders output to</text>
</svg>
