<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="Segoe UI, Arial, sans-serif">
  <rect width="600" height="420" fill="#ffffff"/>
  <text x="300" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1d23">Information Security Model</text>

  <polygon points="300,70 480,360 120,360" fill="none" stroke="#2f6fed" stroke-width="3"/>

  <circle cx="300" cy="70" r="34" fill="#2f6fed"/>
  <text x="300" y="76" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">A</text>

  <circle cx="480" cy="360" r="34" fill="#2f6fed"/>
  <text x="480" y="366" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">B</text>

  <circle cx="120" cy="360" r="34" fill="#2f6fed"/>
  <text x="120" y="366" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">C</text>

  <text x="300" y="45" text-anchor="middle" font-size="14" fill="#1a1d23">Ensuring data is accurate and unaltered</text>
  <text x="480" y="405" text-anchor="middle" font-size="14" fill="#1a1d23">Only authorized users can view data</text>
  <text x="120" y="405" text-anchor="middle" font-size="14" fill="#1a1d23">Systems are accessible when needed</text>
</svg>
