<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="Segoe UI, Arial, sans-serif">
  <rect width="600" height="460" fill="#ffffff"/>
  <text x="300" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1d23">Attack Sequence</text>

  <g font-size="14">
    <rect x="150" y="45" width="300" height="50" rx="8" fill="#eef0f3" stroke="#d5d8de"/>
    <text x="300" y="75" text-anchor="middle" fill="#1a1d23">1. Attacker sends a spoofed email</text>

    <line x1="300" y1="95" x2="300" y2="125" stroke="#9aa3b2" stroke-width="2.5" marker-end="url(#a3)"/>

    <rect x="150" y="125" width="300" height="50" rx="8" fill="#eef0f3" stroke="#d5d8de"/>
    <text x="300" y="155" text-anchor="middle" fill="#1a1d23">2. User clicks the link inside it</text>

    <line x1="300" y1="175" x2="300" y2="205" stroke="#9aa3b2" stroke-width="2.5" marker-end="url(#a3)"/>

    <rect x="150" y="205" width="300" height="50" rx="8" fill="#eef0f3" stroke="#d5d8de"/>
    <text x="300" y="235" text-anchor="middle" fill="#1a1d23">3. Fake login page collects credentials</text>

    <line x1="300" y1="255" x2="300" y2="285" stroke="#9aa3b2" stroke-width="2.5" marker-end="url(#a3)"/>

    <rect x="150" y="285" width="300" height="50" rx="8" fill="#2f6fed" stroke="#255bc4"/>
    <text x="300" y="315" text-anchor="middle" fill="#ffffff">4. Attacker reuses stolen credentials</text>
  </g>

  <defs>
    <marker id="a3" markerWidth="10" markerHeight="10" refX="4" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 z" fill="#9aa3b2"/>
    </marker>
  </defs>

  <text x="300" y="420" text-anchor="middle" font-size="13" fill="#666">Which single word describes step 1 of this attack?</text>
</svg>
