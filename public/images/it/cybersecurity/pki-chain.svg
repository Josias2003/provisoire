<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" font-family="Segoe UI, Arial, sans-serif">
  <rect width="600" height="340" fill="#ffffff"/>
  <text x="300" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1d23">Certificate Trust Chain</text>

  <rect x="220" y="50" width="160" height="55" rx="8" fill="#2f6fed" stroke="#255bc4"/>
  <text x="300" y="83" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Root CA</text>

  <line x1="300" y1="105" x2="300" y2="150" stroke="#9aa3b2" stroke-width="2.5" marker-end="url(#arr2)"/>
  <text x="330" y="132" font-size="12" fill="#666">signs</text>

  <rect x="210" y="150" width="180" height="55" rx="8" fill="#a9c6f9" stroke="#2f6fed"/>
  <text x="300" y="183" text-anchor="middle" font-size="14" font-weight="700" fill="#1a3a6b">Intermediate CA</text>

  <line x1="300" y1="205" x2="300" y2="250" stroke="#9aa3b2" stroke-width="2.5" marker-end="url(#arr2)"/>
  <text x="330" y="232" font-size="12" fill="#666">signs</text>

  <rect x="180" y="250" width="240" height="55" rx="8" fill="#eef0f3" stroke="#d5d8de"/>
  <text x="300" y="283" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1d23">example.com (end-entity cert)</text>

  <defs>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="4" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 z" fill="#9aa3b2"/>
    </marker>
  </defs>
</svg>
