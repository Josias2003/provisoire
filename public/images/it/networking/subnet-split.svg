<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" font-family="Segoe UI, Arial, sans-serif">
  <rect width="600" height="300" fill="#ffffff"/>
  <text x="300" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1d23">Subnetting a /24 Network</text>

  <rect x="80" y="60" width="440" height="60" rx="6" fill="#eef0f3" stroke="#d5d8de" stroke-width="2"/>
  <text x="300" y="96" text-anchor="middle" font-size="16" font-weight="600" fill="#1a1d23">192.168.1.0/24 (256 addresses)</text>

  <text x="300" y="150" text-anchor="middle" font-size="22" fill="#9aa3b2">&#8595; split in half &#8595;</text>

  <rect x="80" y="185" width="210" height="70" rx="6" fill="#2f6fed" stroke="#255bc4" stroke-width="2"/>
  <text x="185" y="215" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">192.168.1.0</text>
  <text x="185" y="238" text-anchor="middle" font-size="14" fill="#e8eefd">128 addresses</text>

  <rect x="310" y="185" width="210" height="70" rx="6" fill="#2f6fed" stroke="#255bc4" stroke-width="2"/>
  <text x="415" y="215" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">192.168.1.128</text>
  <text x="415" y="238" text-anchor="middle" font-size="14" fill="#e8eefd">128 addresses</text>

  <text x="300" y="285" text-anchor="middle" font-size="13" fill="#666">Each half is one new subnet - what subnet mask does each have?</text>
</svg>
