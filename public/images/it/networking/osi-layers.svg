<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="Segoe UI, Arial, sans-serif">
  <rect width="600" height="420" fill="#ffffff"/>
  <text x="300" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1d23">OSI Model</text>
  <!-- 7 layers, top = Application(7) to bottom = Physical(1) -->
  <!-- y positions -->
  <g font-size="15" font-weight="600">
    <rect x="140" y="45"  width="320" height="42" rx="6" fill="#eef0f3" stroke="#d5d8de"/>
    <text x="300" y="71" text-anchor="middle" fill="#1a1d23">7 &#8226; Application</text>

    <rect x="140" y="92" width="320" height="42" rx="6" fill="#eef0f3" stroke="#d5d8de"/>
    <text x="300" y="118" text-anchor="middle" fill="#1a1d23">6 &#8226; Presentation</text>

    <rect x="140" y="139" width="320" height="42" rx="6" fill="#eef0f3" stroke="#d5d8de"/>
    <text x="300" y="165" text-anchor="middle" fill="#1a1d23">5 &#8226; Session</text>

    <rect x="140" y="186" width="320" height="42" rx="6" fill="#2f6fed" stroke="#255bc4"/>
    <text x="300" y="212" text-anchor="middle" fill="#ffffff">4 &#8226; Transport</text>

    <rect x="140" y="233" width="320" height="42" rx="6" fill="#eef0f3" stroke="#d5d8de"/>
    <text x="300" y="259" text-anchor="middle" fill="#1a1d23">3 &#8226; Network</text>

    <rect x="140" y="280" width="320" height="42" rx="6" fill="#eef0f3" stroke="#d5d8de"/>
    <text x="300" y="306" text-anchor="middle" fill="#1a1d23">2 &#8226; Data Link</text>

    <rect x="140" y="327" width="320" height="42" rx="6" fill="#eef0f3" stroke="#d5d8de"/>
    <text x="300" y="353" text-anchor="middle" fill="#1a1d23">1 &#8226; Physical</text>
  </g>
  <text x="300" y="398" text-anchor="middle" font-size="13" fill="#666">One layer is highlighted in blue</text>
</svg>
