<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="Segoe UI, Arial, sans-serif">
  <rect width="600" height="420" fill="#ffffff"/>
  <text x="300" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1d23">Network Topology</text>

  <!-- connecting lines from center to 5 nodes -->
  <g stroke="#9aa3b2" stroke-width="2.5">
    <line x1="300" y1="215" x2="300" y2="100"/>
    <line x1="300" y1="215" x2="470" y2="150"/>
    <line x1="300" y1="215" x2="470" y2="300"/>
    <line x1="300" y1="215" x2="300" y2="360"/>
    <line x1="300" y1="215" x2="130" y2="300"/>
    <line x1="300" y1="215" x2="130" y2="150"/>
  </g>

  <!-- central node -->
  <rect x="255" y="185" width="90" height="60" rx="8" fill="#2f6fed" stroke="#255bc4"/>
  <text x="300" y="220" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Switch</text>

  <!-- peripheral nodes -->
  <g>
    <circle cx="300" cy="85" r="26" fill="#eef0f3" stroke="#d5d8de" stroke-width="2"/>
    <text x="300" y="90" text-anchor="middle" font-size="12" fill="#1a1d23">PC 1</text>

    <circle cx="485" cy="145" r="26" fill="#eef0f3" stroke="#d5d8de" stroke-width="2"/>
    <text x="485" y="150" text-anchor="middle" font-size="12" fill="#1a1d23">PC 2</text>

    <circle cx="485" cy="305" r="26" fill="#eef0f3" stroke="#d5d8de" stroke-width="2"/>
    <text x="485" y="310" text-anchor="middle" font-size="12" fill="#1a1d23">PC 3</text>

    <circle cx="300" cy="375" r="26" fill="#eef0f3" stroke="#d5d8de" stroke-width="2"/>
    <text x="300" y="380" text-anchor="middle" font-size="12" fill="#1a1d23">PC 4</text>

    <circle cx="115" cy="305" r="26" fill="#eef0f3" stroke="#d5d8de" stroke-width="2"/>
    <text x="115" y="310" text-anchor="middle" font-size="12" fill="#1a1d23">PC 5</text>

    <circle cx="115" cy="145" r="26" fill="#eef0f3" stroke="#d5d8de" stroke-width="2"/>
    <text x="115" y="150" text-anchor="middle" font-size="12" fill="#1a1d23">PC 6</text>
  </g>
</svg>
