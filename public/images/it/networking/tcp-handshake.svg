<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" font-family="Segoe UI, Arial, sans-serif">
  <rect width="600" height="340" fill="#ffffff"/>
  <text x="300" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1d23">Establishing a TCP Connection</text>

  <!-- actor headers -->
  <rect x="70" y="45" width="120" height="36" rx="6" fill="#eef0f3" stroke="#d5d8de"/>
  <text x="130" y="68" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1d23">Client</text>
  <rect x="410" y="45" width="120" height="36" rx="6" fill="#eef0f3" stroke="#d5d8de"/>
  <text x="470" y="68" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1d23">Server</text>

  <!-- lifelines -->
  <line x1="130" y1="81" x2="130" y2="310" stroke="#c7cbd3" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="470" y1="81" x2="470" y2="310" stroke="#c7cbd3" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- message 1: client -> server -->
  <line x1="130" y1="120" x2="465" y2="120" stroke="#2f6fed" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="300" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#2f6fed">1</text>

  <!-- message 2: server -> client -->
  <line x1="470" y1="185" x2="135" y2="185" stroke="#2f6fed" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="300" y="177" text-anchor="middle" font-size="14" font-weight="700" fill="#2f6fed">2</text>

  <!-- message 3: client -> server -->
  <line x1="130" y1="250" x2="465" y2="250" stroke="#2f6fed" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="300" y="242" text-anchor="middle" font-size="14" font-weight="700" fill="#2f6fed">3</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2f6fed"/>
    </marker>
  </defs>

  <text x="300" y="325" text-anchor="middle" font-size="13" fill="#666">Three messages establish the connection, in order 1, 2, 3</text>
</svg>
