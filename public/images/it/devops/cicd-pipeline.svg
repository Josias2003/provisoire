<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" font-family="Segoe UI, Arial, sans-serif">
  <rect width="600" height="200" fill="#ffffff"/>
  <text x="300" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1d23">CI/CD Pipeline Stages</text>

  <g font-size="13">
    <rect x="10" y="65" width="105" height="50" rx="8" fill="#eef0f3" stroke="#d5d8de"/>
    <text x="62" y="95" text-anchor="middle" fill="#1a1d23">Source</text>

    <rect x="140" y="65" width="105" height="50" rx="8" fill="#eef0f3" stroke="#d5d8de"/>
    <text x="192" y="95" text-anchor="middle" fill="#1a1d23">Build</text>

    <rect x="270" y="65" width="105" height="50" rx="8" fill="#2f6fed" stroke="#255bc4"/>
    <text x="322" y="95" text-anchor="middle" fill="#ffffff">Test</text>

    <rect x="400" y="65" width="105" height="50" rx="8" fill="#eef0f3" stroke="#d5d8de"/>
    <text x="452" y="95" text-anchor="middle" fill="#1a1d23">Deploy</text>

    <rect x="530" y="65" width="60" height="50" rx="8" fill="#eef0f3" stroke="#d5d8de"/>
    <text x="560" y="90" text-anchor="middle" font-size="11" fill="#1a1d23">Mon-</text>
    <text x="560" y="103" text-anchor="middle" font-size="11" fill="#1a1d23">itor</text>
  </g>

  <g stroke="#9aa3b2" stroke-width="2.5" marker-end="url(#a11)">
    <line x1="115" y1="90" x2="138" y2="90"/>
    <line x1="245" y1="90" x2="268" y2="90"/>
    <line x1="375" y1="90" x2="398" y2="90"/>
    <line x1="505" y1="90" x2="528" y2="90"/>
  </g>
  <defs>
    <marker id="a11" markerWidth="10" markerHeight="10" refX="4" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 z" fill="#9aa3b2"/>
    </marker>
  </defs>

  <text x="300" y="160" text-anchor="middle" font-size="13" fill="#666">Which stage (highlighted) comes immediately before 'Deploy'?</text>
</svg>
