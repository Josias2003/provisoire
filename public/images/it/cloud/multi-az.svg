<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" font-family="Segoe UI, Arial, sans-serif">
  <rect width="600" height="340" fill="#ffffff"/>
  <text x="300" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1d23">Multi-AZ Architecture</text>

  <rect x="60" y="45" width="480" height="255" rx="10" fill="#f7f8fa" stroke="#d5d8de" stroke-width="2"/>
  <text x="300" y="68" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d23">Region: us-east-1</text>

  <rect x="220" y="80" width="160" height="45" rx="8" fill="#2f6fed" stroke="#255bc4"/>
  <text x="300" y="107" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Load Balancer</text>

  <rect x="90" y="180" width="180" height="90" rx="8" fill="#eef0f3" stroke="#d5d8de" stroke-width="2"/>
  <text x="180" y="205" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d23">Availability Zone A</text>
  <rect x="120" y="220" width="120" height="35" rx="6" fill="#ffffff" stroke="#d5d8de"/>
  <text x="180" y="242" text-anchor="middle" font-size="11.5" fill="#1a1d23">App instance</text>

  <rect x="330" y="180" width="180" height="90" rx="8" fill="#eef0f3" stroke="#d5d8de" stroke-width="2"/>
  <text x="420" y="205" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d23">Availability Zone B</text>
  <rect x="360" y="220" width="120" height="35" rx="6" fill="#ffffff" stroke="#d5d8de"/>
  <text x="420" y="242" text-anchor="middle" font-size="11.5" fill="#1a1d23">App instance</text>

  <line x1="260" y1="125" x2="180" y2="178" stroke="#9aa3b2" stroke-width="2.5"/>
  <line x1="340" y1="125" x2="420" y2="178" stroke="#9aa3b2" stroke-width="2.5"/>

  <text x="300" y="325" text-anchor="middle" font-size="13" fill="#666">What is the main benefit of spreading instances across two AZs like this?</text>
</svg>
