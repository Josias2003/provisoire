<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" font-family="Segoe UI, Arial, sans-serif">
  <rect width="600" height="200" fill="#ffffff"/>
  <text x="300" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1d23">Deployment Pipeline</text>

  <g font-size="12.5">
    <rect x="15" y="60" width="120" height="55" rx="8" fill="#eef0f3" stroke="#d5d8de"/>
    <text x="75" y="92" text-anchor="middle" fill="#1a1d23">Git commit</text>

    <rect x="165" y="60" width="120" height="55" rx="8" fill="#eef0f3" stroke="#d5d8de"/>
    <text x="225" y="92" text-anchor="middle" fill="#1a1d23">Build &amp; test</text>

    <rect x="315" y="60" width="120" height="55" rx="8" fill="#2f6fed" stroke="#255bc4"/>
    <text x="375" y="86" text-anchor="middle" fill="#ffffff">Push image to</text>
    <text x="375" y="101" text-anchor="middle" fill="#ffffff">registry</text>

    <rect x="465" y="60" width="120" height="55" rx="8" fill="#eef0f3" stroke="#d5d8de"/>
    <text x="525" y="92" text-anchor="middle" fill="#1a1d23">Deploy to cloud</text>
  </g>

  <g stroke="#9aa3b2" stroke-width="2.5" marker-end="url(#a8)">
    <line x1="135" y1="87" x2="160" y2="87"/>
    <line x1="285" y1="87" x2="310" y2="87"/>
    <line x1="435" y1="87" x2="460" y2="87"/>
  </g>
  <defs>
    <marker id="a8" markerWidth="10" markerHeight="10" refX="4" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 z" fill="#9aa3b2"/>
    </marker>
  </defs>

  <text x="300" y="155" text-anchor="middle" font-size="13" fill="#666">What happens (highlighted step) right after build &amp; test succeeds?</text>
</svg>
